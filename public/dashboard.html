<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>VERO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

:root {
  --bg-deep: #0a0e1a;
  --bg-card: #111627;
  --bg-input: #0d1120;
  --bg-hover: #151b2e;
  --border: #1a1f35;
  --border-light: #222840;
  --text: #c8cde0;
  --text-secondary: #8a8ea8;
  --text-muted: #5a5e78;
  --accent: #5270e8;
  --accent-light: #6b84f2;
  --accent-bg: rgba(82,112,232,0.06);
  --red: #e85d5d;
  --red-bg: rgba(232,93,93,0.08);
  --green: #4ecb71;
  --green-bg: rgba(78,203,113,0.08);
  --orange: #f0a040;
  --orange-bg: rgba(240,160,64,0.08);
  --orange-border: rgba(240,160,64,0.2);
  --selected-bg: rgba(82,112,232,0.2);
  --selected-border: #6b84f2;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --shadow: 0 2px 12px rgba(0,0,0,0.2);
}

body{
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  height: 100vh;
  height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.container{
  max-width:1100px;
  width:100%;
  margin:0 auto;
  padding:8px;
  display:flex;
  flex-direction:column;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

header{
  background: var(--bg-card);
  padding: 10px 22px;
  border-radius: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  border: 1px solid var(--border);
  flex-shrink: 0;
}

.header-left { display: flex; align-items: center; }
.header-title { color: var(--accent-light); font-size: 20px; font-weight: 700; letter-spacing: -0.02em }

nav{display:flex;align-items:center;gap:12px}
nav span{color:var(--text-secondary);font-size:13px}
nav button{
  color:var(--text-secondary);padding:7px 14px;border-radius:8px;
  cursor:pointer;background:transparent;border:1px solid var(--border);
  font-size:12px;transition:0.2s;font-family:'Inter',sans-serif;
}
nav button:hover{background:var(--bg-hover);color:var(--text)}

.temp-banner{
  background:var(--orange-bg);border:1px solid var(--orange-border);
  padding:8px 16px;border-radius:10px;margin-bottom:8px;
  color:var(--orange);font-size:13px;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  flex-shrink:0;
}
.temp-banner .temp-close{
  background:rgba(240,160,64,0.2);color:var(--orange);
  border:1px solid var(--orange-border);padding:6px 14px;
  border-radius:7px;cursor:pointer;font-size:11px;font-weight:600;transition:0.2s;
}
.temp-banner .temp-close:hover{background:rgba(240,160,64,0.35)}

.tabs{
  display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;
  flex-shrink:0;
}
.tab{
  padding:8px 16px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:10px;cursor:pointer;color:var(--text-secondary);
  font-size:13px;transition:0.2s;font-family:'Inter',sans-serif;
}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

#tc{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  min-height:0;
}

body.chat-open header,
body.chat-open .temp-banner,
body.chat-open .tabs {
  display: none;
}
body.chat-open .container {
  padding: 0;
}
body.chat-open #tc {
  padding: 0;
  overflow: hidden;
}

.panel{
  background:var(--bg-card);padding:20px;border-radius:14px;
  border:1px solid var(--border);margin-bottom:8px;
}
.panel h2{color:var(--accent);font-size:15px;font-weight:600;margin-bottom:12px}

.upload-area{
  border:2px dashed var(--border);border-radius:12px;
  padding:28px;text-align:center;cursor:pointer;transition:0.2s;
}
.upload-area:hover{border-color:var(--accent);background:var(--accent-bg)}
.upload-area input{display:none}

.btn{
  display:inline-block;padding:8px 16px;background:var(--accent);
  color:#fff;border:none;border-radius:10px;cursor:pointer;
  font-size:11px;font-weight:500;margin:2px;transition:0.2s;
  font-family:'Inter',sans-serif;
}
.btn:hover{background:var(--accent-light)}
.btn-red{background:var(--red-bg);color:var(--red)}.btn-red:hover{background:rgba(232,93,93,0.15)}
.btn-green{background:var(--green-bg);color:var(--green)}.btn-green:hover{background:rgba(78,203,113,0.15)}
.btn-gray{background:var(--bg-input);color:var(--text-secondary)}.btn-gray:hover{background:var(--bg-hover)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px}
.file-card{
  background:var(--bg-input);border-radius:10px;overflow:hidden;
  border:1px solid var(--border);cursor:pointer;transition:0.2s;
}
.file-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.file-card img{width:100%;height:130px;object-fit:cover;display:block}
.file-card .info{padding:8px 10px}
.file-card .name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary)}

.user-list{display:flex;flex-direction:column;gap:6px}
.user-item{
  background:var(--bg-input);padding:10px 14px;border-radius:10px;
  display:flex;justify-content:space-between;align-items:center;
  border:1px solid var(--border);gap:10px;flex-wrap:wrap;
}
.user-item .user-info{display:flex;align-items:center;gap:10px}
.avatar-sm{
  width:36px;height:36px;border-radius:50%;background:var(--bg-card);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  flex-shrink:0;border:2px solid var(--border);cursor:pointer;transition:0.2s;
}
.avatar-sm:hover{border-color:var(--accent-light);transform:scale(1.05)}
.avatar-sm img{width:100%;height:100%;object-fit:cover}
.avatar-sm span{font-size:16px;opacity:0.5}

/* ========== ЧАТ НА ВЕСЬ ЭКРАН ========== */
.chat-fullscreen {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--bg-deep);
  z-index: 50;
  display: flex;
  flex-direction: column;
  padding: 8px;
}

.chat-fullscreen .chat-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg-card);
  border-radius: 14px;
  border: 1px solid var(--border);
  overflow: hidden;
}

.chat-fullscreen .chat-header {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.chat-fullscreen .chat-header h2 {
  flex: 1;
  font-size: 14px;
  color: var(--text);
  margin: 0;
}

/* ===== ИКОНКИ НА ЭМОДЗИ ===== */
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  padding: 0;
  font-size: 18px;
  line-height: 1;
}

.icon-btn:hover {
  background: var(--bg-hover);
  color: var(--text);
  transform: scale(1.05);
}

.voice-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  font-size: 16px;
}

.voice-btn:hover {
  transform: scale(1.05);
  background: var(--accent-light);
}

.voice-btn.recording {
  background: var(--red);
  animation: pulse 1.5s infinite;
}

/* ===== СВЕТЛО-СИНИЕ ЭМОДЗИ ДЛЯ КНОПОК ЧАТА ===== */
.icon-btn .chat-emoji,
.voice-btn .chat-emoji,
.btn-gray .chat-emoji,
.chat-header .btn .chat-emoji {
  filter: brightness(0) saturate(100%) invert(45%) sepia(100%) saturate(500%) hue-rotate(200deg) brightness(110%);
  display: inline-block;
}

/* НО КНОПКИ В МЕНЮ СООБЩЕНИЙ ОСТАВЛЯЕМ ЦВЕТНЫМИ */
.msg-actions .action-btn {
  filter: none !important;
}

/* Статусы, реакции, индикаторы - сохраняем цвета */
.msg .reaction-badge,
.msg-status,
.avatar-sm span,
.temp-banner,
.badge,
.recording-bar,
.self-destruct-badge,
.msg .reply-preview .reply-preview-username {
  filter: none !important;
}

/* Поиск в чате */
.chat-search-bar {
  display: none;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-search-bar.active { display: flex; gap: 6px; align-items: center; }
.chat-search-bar input {
  flex: 1;
  padding: 6px 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 11px;
  outline: none;
  font-family: 'Inter', sans-serif;
}
.chat-search-bar .search-count { font-size: 10px; color: var(--text-muted); white-space: nowrap; }
.chat-search-bar .search-nav { display: flex; gap: 3px; }
.chat-search-bar .search-nav button {
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 10px;
  font-family: 'Inter', sans-serif;
}
.chat-search-bar .search-nav button:hover { background: var(--bg-hover); }

.chat-container{
  display:flex;
  flex-direction:column;
  flex: 1;
  min-height: 0;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:8px;
  background:var(--bg-input);
  display:flex;
  flex-direction:column;
  gap:4px;
  scroll-behavior:smooth;
}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.msg{
  max-width:65%;
  padding:5px 8px;
  border-radius:8px;
  font-size:10px;
  word-wrap:break-word;
  line-height:1.3;
  cursor:pointer;
  transition:all 0.15s;
  position:relative;
  scroll-margin-top:20px;
}
.msg.sent{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:2px}
.msg.received{align-self:flex-start;background:var(--bg-hover);color:var(--text);border-bottom-left-radius:2px}
.msg.sticker-msg{background:transparent!important;padding:2px;max-width:130px}
.msg.sticker-msg img{max-width:120px;max-height:120px;border-radius:4px}

/* Подсветка поиска */
.msg.search-highlight {
  background: var(--orange-bg) !important;
  border: 2px solid var(--orange) !important;
  box-shadow: 0 0 12px rgba(240,160,64,0.4);
  z-index: 5;
}
.msg.search-current {
  background: var(--orange) !important;
  color: #fff !important;
  border: 2px solid #fff !important;
  box-shadow: 0 0 16px rgba(240,160,64,0.7);
  z-index: 6;
}
.msg.sent.search-highlight { background: var(--orange-bg) !important; }
.msg.sent.search-current { background: var(--orange) !important; }

/* Подсветка при навигации к сообщению */
.msg.highlight {
  animation: highlightAnim 1.5s ease-out;
  z-index: 10;
}

@keyframes highlightAnim {
  0% { 
    box-shadow: 0 0 0 4px var(--accent-light);
    background: var(--selected-bg);
    transform: scale(1.03);
  }
  50% {
    transform: scale(1.01);
  }
  100% {
    box-shadow: 0 0 0 0 transparent;
    background: transparent;
    transform: scale(1);
  }
}

.self-destruct-img{
  filter: blur(50px) brightness(0.5);
  transition: none;
  cursor: pointer;
  position: relative;
  user-select: none;
}
.self-destruct-badge{
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 9px;
  font-weight: 700;
  pointer-events: none;
  z-index: 2;
  white-space: nowrap;
  letter-spacing: 0.5px;
}
.self-destruct-wrapper{
  position: relative;
  display: inline-block;
}

.photo-send-options{
  display: none;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 4px;
  align-items: center;
}
.photo-send-options.visible{
  display: flex;
}
.photo-send-option{
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 600;
  border: 2px solid transparent;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
  white-space: nowrap;
}
.photo-send-option.normal{
  background: var(--accent-bg);
  color: var(--accent-light);
  border-color: var(--accent);
}
.photo-send-option.normal:hover{
  background: rgba(82,112,232,0.2);
}
.photo-send-option.destruct{
  background: var(--orange-bg);
  color: var(--orange);
  border-color: var(--orange-border);
}
.photo-send-option.destruct:hover{
  background: rgba(240,160,64,0.2);
  border-color: var(--orange);
}
.photo-send-option.selected{
  transform: scale(1.05);
  box-shadow: 0 0 12px rgba(0,0,0,0.3);
}
.photo-send-option.normal.selected{
  background: var(--accent);
  color: #fff;
}
.photo-send-option.destruct.selected{
  background: var(--orange);
  color: #fff;
  border-color: var(--orange);
}

.msg-status{display:inline-block;margin-left:3px;font-size:8px;vertical-align:middle}
.msg-status.sent-indicator{opacity:0.5}
.msg-status.read-indicator{color:#4ecb71}

.msg.selected{
  outline:2px solid var(--selected-border);
  outline-offset:2px;
  background:var(--selected-bg)!important;
  box-shadow:0 0 10px rgba(107,132,242,0.3);
  transform:scale(1.02);
  z-index:5;
}

.selected-checkmark{
  position:absolute;
  top:-7px;
  right:-7px;
  width:18px;
  height:18px;
  background:var(--accent-light);
  color:#fff;
  border-radius:50%;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  z-index:6;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
  pointer-events:none;
}

.msg .msg-header{display:flex;align-items:center;gap:4px;margin-bottom:1px}
.msg .msg-avatar{width:16px;height:16px;border-radius:50%;overflow:hidden;flex-shrink:0;cursor:pointer}
.msg .msg-avatar img{width:100%;height:100%;object-fit:cover}
.msg .msg-username{font-size:8px;opacity:0.7;font-weight:600}
.msg .time{font-size:7px;opacity:0.5;margin-top:1px;text-align:right}
.msg img.msg-img{max-width:150px;max-height:150px;border-radius:5px;cursor:pointer;display:block;margin:2px 0}

.forward-badge{font-size:7px;opacity:0.7;margin-bottom:1px;font-style:italic}

.msg-reactions{display:flex;gap:1px;margin-top:2px;flex-wrap:wrap}
.reaction-badge{background:rgba(255,255,255,0.08);padding:1px 4px;border-radius:6px;font-size:10px;cursor:pointer;display:flex;align-items:center;gap:1px;transition:0.2s;border:1px solid transparent}
.reaction-badge:hover{background:rgba(255,255,255,0.15)}
.reaction-badge.mine{border-color:var(--accent-light);background:var(--accent-bg)}
.reaction-count{font-size:8px;opacity:0.7}
.msg.sent .reaction-badge{background:rgba(255,255,255,0.12)}.msg.sent .reaction-badge:hover{background:rgba(255,255,255,0.2)}

/* ===== МЕНЮ НАД СООБЩЕНИЕМ (Реакции + Ответ + Редактировать) ===== */
.msg-actions {
  position: absolute;
  top: -24px;
  left: 50%;
  transform: translateX(-50%) scale(0.9);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px 6px;
  display: flex;
  gap: 2px;
  opacity: 0;
  visibility: hidden;
  transition: all 0.2s ease;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  z-index: 20;
  white-space: nowrap;
  pointer-events: none;
}

.msg-actions.show {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) scale(1);
  pointer-events: all;
}

.msg-actions .action-btn {
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 12px;
  font-size: 12px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
}

.msg-actions .action-btn:hover {
  background: var(--bg-hover);
  color: var(--text);
  transform: scale(1.1);
}

.msg-actions .action-btn.reply-btn {
  color: var(--accent-light);
}

.msg-actions .action-btn.reply-btn:hover {
  background: var(--accent-bg);
  color: var(--accent);
}

.msg-actions .action-btn.reaction-btn {
  color: var(--orange);
}

.msg-actions .action-btn.reaction-btn:hover {
  background: var(--orange-bg);
  color: var(--orange);
}

.msg-actions .action-divider {
  width: 1px;
  background: var(--border);
  margin: 4px 2px;
}

.reaction-picker{
  display:none;
  position:fixed;
  bottom: 120px;
  left: 50%;
  transform:translateX(-50%);
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:6px 10px;
  gap:4px;
  z-index:100;
  box-shadow:0 4px 20px rgba(0,0,0,0.6);
  flex-wrap:wrap;
  justify-content:center;
}
.reaction-picker.active{display:flex}
.reaction-picker .emoji-btn{font-size:22px;cursor:pointer;padding:4px 6px;border-radius:8px;transition:0.2s;background:none;border:none}
.reaction-picker .emoji-btn:hover{background:var(--bg-hover);transform:scale(1.3)}

.msg-actions-bar{display:none;background:var(--bg-card);padding:8px 10px;border-radius:8px;margin-bottom:6px;gap:6px;align-items:center;flex-wrap:wrap;border:1px solid var(--accent)}
.msg-actions-bar.active{display:flex}
.msg-actions-bar .btn{font-size:10px;padding:5px 10px}

/* ========== ГОЛОСОВЫЕ СООБЩЕНИЯ ========== */
.msg-audio-container {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 160px;
  max-width: 220px;
  background: var(--bg-input);
  padding: 4px 8px;
  border-radius: 20px;
  border: 1px solid var(--border);
}

.msg-audio-play {
  width: 28px;
  height: 28px;
  min-width: 28px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  color: #fff;
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.msg-audio-play:hover { transform: scale(1.05); }
.msg-audio-play:active { transform: scale(0.92); }
.msg-audio-play.playing { background: var(--red); }

.msg-audio-wave {
  flex: 1;
  height: 24px;
  display: flex;
  align-items: center;
  gap: 2px;
  cursor: pointer;
}

.msg-audio-wave .bar {
  flex: 1;
  background: var(--accent-light);
  border-radius: 2px;
  transition: all 0.15s ease;
  min-width: 2px;
  height: 10px;
}

.msg-audio-duration {
  font-size: 9px;
  color: inherit;
  opacity: 0.7;
  min-width: 32px;
  text-align: right;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.msg.sent .msg-audio-wave .bar { background: rgba(255,255,255,0.6); }
.msg.sent .msg-audio-container { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); }
.msg.received .msg-audio-wave .bar { background: var(--accent-light); }

/* ========== ВИДЕО-КРУЖКИ ========== */
.video-circle {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  overflow: hidden;
  background: #05070b;
  position: relative;
  cursor: pointer;
  border: 3px solid var(--border);
  flex-shrink: 0;
  transition: all 0.2s ease;
}

.video-circle:hover {
  border-color: var(--accent);
  transform: scale(1.02);
}

.video-circle video {
  position:relative;z-index:1;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.video-circle .play-overlay {
  z-index:2;
  pointer-events:none;
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.video-circle:hover .play-overlay {
  opacity: 1;
}

.video-circle .play-overlay svg {
  width: 40px;
  height: 40px;
  fill: rgba(255,255,255,0.9);
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.video-circle .duration {
  z-index:3;
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: rgba(0,0,0,0.8);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  color: #fff;
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.1);
}

.video-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.msg-video-round-wrapper {
  position: relative;
  display: inline-block;
  cursor: pointer;
  border-radius: 50%;
  overflow: hidden;
  width: 110px;
  height: 110px;
  flex-shrink: 0;
}

.msg-video-round {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  border: 2px solid var(--border);
  transition: all 0.2s ease;
  background: #000;
}

.msg-video-round:hover { border-color: var(--accent); transform: scale(1.02); }
.msg-video-round:active { transform: scale(0.95); }

.msg-video-play-badge {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  color: #fff;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  border: 2px solid rgba(255,255,255,0.3);
}

.msg-video-duration-badge {
  position: absolute;
  bottom: 6px;
  right: 6px;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  color: #fff;
  padding: 2px 5px;
  border-radius: 3px;
  font-size: 8px;
  font-weight: 500;
}

.msg .file-box{background:rgba(255,255,255,0.06);padding:5px 7px;border-radius:5px;margin:2px 0;cursor:pointer;display:flex;align-items:center;gap:5px;transition:0.2s;font-size:9px}
.msg .file-box:hover{background:rgba(255,255,255,0.12)}

/* ========== РАСШИРЯЮЩЕЕСЯ ПОЛЕ ВВОДА ========== */
#mi {
  resize: none;
  min-height: 36px;
  max-height: 150px;
  overflow-y: auto;
  line-height: 1.4;
  padding: 8px 10px;
  transition: height 0.1s ease;
}

/* ===== МЕНЮ РЕДАКТИРОВАНИЯ СООБЩЕНИЯ ===== */
.edit-msg-modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 150;
  align-items: center;
  justify-content: center;
}

.edit-msg-modal.active {
  display: flex;
}

.edit-msg-modal .modal-content {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 20px;
  width: 90%;
  max-width: 400px;
  border: 1px solid var(--border);
}

.edit-msg-modal .modal-content textarea {
  width: 100%;
  padding: 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  resize: vertical;
  min-height: 60px;
  margin-bottom: 10px;
}

.edit-msg-modal .modal-content .edit-buttons {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* ========== НАСТРОЙКИ РАЗМЕРА ЧАТА ========== */
.chat-size-control {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.chat-size-control label {
  font-size: 11px;
  color: var(--text-secondary);
}

.chat-size-control input[type="range"] {
  flex: 1;
  accent-color: var(--accent);
  background: var(--bg-input);
  height: 4px;
  border-radius: 2px;
  -webkit-appearance: none;
}

.chat-size-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

.chat-size-control .size-value {
  font-size: 11px;
  color: var(--text-secondary);
  min-width: 30px;
  text-align: center;
}

/* ========== ОТВЕТ НА СООБЩЕНИЕ (КАК В TELEGRAM) ========== */
.reply-indicator {
  display: none;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: var(--accent-bg);
  border-left: 4px solid var(--accent);
  border-radius: 8px;
  margin-bottom: 4px;
  margin-top: 4px;
  flex-shrink: 0;
  animation: slideDown 0.2s ease;
}

.reply-indicator.active {
  display: flex;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.reply-indicator .reply-content {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}

.reply-indicator .reply-label {
  font-size: 10px;
  color: var(--accent-light);
  font-weight: 600;
}

.reply-indicator .reply-label .reply-username {
  color: var(--accent-light);
}

.reply-indicator .reply-text {
  font-size: 11px;
  color: var(--text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-style: italic;
}

.reply-indicator .reply-close {
  background: var(--red-bg);
  border: none;
  color: var(--red);
  cursor: pointer;
  font-size: 16px;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}

.reply-indicator .reply-close:hover {
  background: var(--red);
  color: #fff;
  transform: scale(1.1);
}

/* Ответ в сообщении */
.msg .reply-preview {
  font-size: 8px;
  color: var(--text-muted);
  margin-bottom: 2px;
  padding: 2px 6px;
  background: var(--accent-bg);
  border-radius: 4px;
  border-left: 2px solid var(--accent);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 4px;
}

.msg .reply-preview:hover {
  background: var(--selected-bg);
  border-color: var(--accent-light);
}

.msg .reply-preview .reply-preview-icon {
  font-size: 10px;
}

.msg .reply-preview .reply-preview-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

.msg .reply-preview .reply-preview-username {
  color: var(--accent-light);
  font-weight: 600;
}

.chat-input-area{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input-area input[type="text"]{flex:1;min-width:80px;padding:8px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;font-size:11px;transition:0.2s;font-family:'Inter',sans-serif}
.chat-input-area input[type="text"]:focus{border-color:var(--accent)}
.chat-input-area input[type="file"]{display:none}

.paste-preview{display:none;margin-bottom:4px;padding:8px;background:var(--bg-input);border:1px dashed var(--accent);border-radius:8px}
.paste-preview.active{display:block}
.paste-preview .preview-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.paste-preview .preview-title{color:var(--accent-light);font-size:11px;font-weight:600}
.paste-preview .preview-close{background:var(--red-bg);color:var(--red);border:none;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:10px}
.paste-preview img{max-width:100%;max-height:150px;border-radius:6px;display:block;margin:0 auto}
.paste-preview .file-list{display:flex;flex-wrap:wrap;gap:6px}
.paste-preview .paste-file-item{background:var(--bg-card);padding:6px 10px;border-radius:6px;display:flex;align-items:center;gap:6px;font-size:10px}

.recording-bar{width:100%;padding:6px;background:var(--red-bg);color:var(--red);border-radius:8px;text-align:center;font-weight:600;font-size:11px;display:none;margin-bottom:4px}
.btn-rec{background:var(--red)!important;color:#fff!important;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}

.badge{background:var(--red);color:#fff;padding:2px 6px;border-radius:7px;font-size:10px;margin-left:4px}

.lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.96);z-index:100;align-items:center;justify-content:center}
.lightbox.active{display:flex}
.lightbox img,.lightbox video{max-width:95vw;max-height:90vh;border-radius:8px}
.lightbox-close{position:absolute;top:20px;right:20px;color:#fff;font-size:26px;cursor:pointer;background:none;border:none;opacity:0.7}
.lightbox-close:hover{opacity:1}
.empty{text-align:center;color:var(--text-muted);padding:30px;font-size:13px}

/* ========== МОДАЛЬНОЕ ОКНО НАСТРОЕК ========== */
.modal-overlay {display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;background: rgba(0,0,0,0.8); z-index: 200;align-items: center; justify-content: center;}
.modal-overlay.active { display: flex; }
.modal {background: var(--bg-card); border-radius: var(--radius);border: 1px solid var(--border); width: 100%; max-width: 440px;max-height: 80vh; overflow-y: auto;padding: 24px 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);}
.modal h2 { color: var(--text); font-size: 16px; font-weight: 600; margin-bottom: 16px; text-align: center; }
.modal .current-avatar-section { text-align: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.modal .current-avatar {width: 100px; height: 100px; border-radius: 50%; object-fit: cover;border: 2px solid var(--accent); cursor: pointer; transition: transform 0.2s;}
.modal .current-avatar:hover { transform: scale(1.05); }
.modal .avatar-history {display: grid;grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));gap: 10px;margin-bottom: 16px;}
.modal .avatar-history-item { position: relative; cursor: pointer; }
.modal .avatar-history-item img {width: 70px; height: 70px; border-radius: 50%; object-fit: cover;border: 2px solid var(--border); transition: all 0.2s;}
.modal .avatar-history-item.active img {border-color: var(--accent);box-shadow: 0 0 12px rgba(82,112,232,0.4);}
.modal .avatar-history-item:hover img {border-color: var(--accent-light);}
.modal .avatar-delete-btn {position: absolute; top: -4px; right: -4px; width: 20px; height: 20px;background: var(--red); color: #fff; border: none; border-radius: 50%;font-size: 10px; cursor: pointer; display: none; align-items: center;justify-content: center; line-height: 1;}
.modal .avatar-history-item:hover .avatar-delete-btn {display: flex;}
.modal .upload-new-btn {width: 100%; padding: 10px; background: var(--accent); color: #fff;border: none; border-radius: var(--radius-xs); font-size: 12px; font-weight: 600;cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; margin-bottom: 16px;}
.modal .upload-new-btn:hover { background: var(--accent-light); }
.modal .close-btn {width: 100%; padding: 10px; background: var(--bg-input); color: var(--text-secondary);border: 1px solid var(--border); border-radius: var(--radius-xs); font-size: 12px;cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif;}
.modal .close-btn:hover { background: var(--bg-hover); }
.modal .empty-history { text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px; }
.modal .section-title { color: var(--text-muted); font-size: 11px; font-weight: 500; letter-spacing: 0.05em; margin-bottom: 10px; }

/* Модалка медиа */
.media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.media-item { aspect-ratio: 1; border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--bg-input); border: 2px solid var(--border); transition: 0.2s; display: flex; align-items: center; justify-content: center; position: relative; }
.media-item:hover { border-color: var(--accent); transform: scale(1.03); }
.media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; }
.media-item .file-icon { font-size: 30px; }
.media-item .play-icon { position: absolute; font-size: 24px; pointer-events: none; }
.media-tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.media-tab { padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 10px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-secondary); font-family: 'Inter', sans-serif; transition: 0.2s; }
.media-tab:hover { border-color: var(--accent); }
.media-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ========== ПРОСМОТР АВАТАРОК ========== */
.avatar-viewer-overlay {display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;background: rgba(0,0,0,0.9); z-index: 300;flex-direction: column; align-items: center; justify-content: center;}
.avatar-viewer-overlay.active { display: flex; }
.avatar-viewer-overlay .viewer-close {position: absolute; top: 20px; right: 20px; color: #fff; font-size: 28px;cursor: pointer; background: none; border: none; opacity: 0.7; z-index: 301;}
.avatar-viewer-overlay .viewer-close:hover { opacity: 1; }
.avatar-viewer-overlay .viewer-main {width: 200px; height: 200px; border-radius: 50%; object-fit: cover;border: 3px solid var(--accent); box-shadow: 0 0 40px rgba(82,112,232,0.3); margin-bottom: 20px;}
.avatar-viewer-overlay .viewer-username { color: #fff; font-size: 16px; font-weight: 600; margin-bottom: 20px; }
.avatar-viewer-overlay .viewer-nav { display: flex; gap: 16px; align-items: center; }
.avatar-viewer-overlay .viewer-nav-btn {width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1);border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 20px;cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;}
.avatar-viewer-overlay .viewer-nav-btn:hover { background: rgba(255,255,255,0.2); }
.avatar-viewer-overlay .viewer-dots { display: flex; gap: 6px; }
.avatar-viewer-overlay .viewer-dot {width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3);transition: all 0.2s; cursor: pointer;}
.avatar-viewer-overlay .viewer-dot.active { background: var(--accent-light); width: 24px; border-radius: 4px; }
.avatar-viewer-overlay .viewer-counter { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 12px; }

.pinned-list-item{background:var(--bg-input);padding:12px;border-radius:10px;margin-bottom:8px;cursor:pointer;border:1px solid var(--border);transition:0.2s}
.pinned-list-item:hover{background:var(--bg-hover);border-color:var(--accent)}
.pinned-list-item .pinned-content{display:flex;gap:10px;align-items:flex-start}
.pinned-list-item .pinned-thumb{width:50px;height:50px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
.pinned-list-item .pinned-thumb img{width:100%;height:100%;object-fit:cover}
.pinned-list-item .pinned-info{flex:1;min-width:0}
.pinned-list-item .pinned-text{font-size:12px;color:var(--text);margin-bottom:4px;word-wrap:break-word;line-height:1.4}
.pinned-list-item .pinned-meta{font-size:9px;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.pinned-list-item .unpin-btn{background:var(--red-bg);color:var(--red);border:none;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:9px;margin-top:4px}
.pinned-section-title{color:var(--accent-light);font-size:13px;font-weight:600;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.pinned-section-title.private{color:var(--orange)}

.forward-list-item{background:var(--bg-input);padding:10px 12px;border-radius:8px;margin-bottom:6px;cursor:pointer;border:1px solid var(--border);transition:0.2s}
.forward-list-item:hover{background:var(--bg-hover);border-color:var(--accent)}

/* ========== СТИКЕРЫ ========== */
.sticker-packs-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.sticker-pack-card {
  background: var(--bg-input);
  border-radius: 12px;
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  border: 2px solid var(--border);
  transition: all 0.2s;
}
.sticker-pack-card:hover {
  border-color: var(--accent);
  background: var(--bg-hover);
  transform: translateY(-2px);
}
.sticker-pack-card .pack-icon { font-size: 40px; margin-bottom: 8px; }
.sticker-pack-card .pack-name { font-size: 12px; color: var(--text); font-weight: 600; }
.sticker-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.sticker-item {
  cursor: pointer;
  padding: 6px;
  border-radius: 10px;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-input);
  aspect-ratio: 1;
}
.sticker-item:hover { background: var(--bg-hover); transform: scale(1.08); }
.sticker-item img { width: 100%; height: 100%; object-fit: contain; max-width: 70px; max-height: 70px; }
.sticker-back-btn {
  width: 100%;
  padding: 8px;
  margin-bottom: 12px;
  background: var(--bg-input);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 11px;
  font-family: 'Inter', sans-serif;
  transition: all 0.2s;
}
.sticker-back-btn:hover { background: var(--bg-hover); color: var(--text); }

/* ========== ТЕЛЕФОН ========== */
@media (max-width: 480px) {
  .container { padding: 4px; }
  header { padding: 8px 12px; border-radius: 10px; margin-bottom: 4px; }
  .tabs { gap: 3px; margin-bottom: 4px; }
  .tab { padding: 7px 10px; font-size: 10px; flex: 1; text-align: center; }
  .panel { padding: 12px 10px; border-radius: 12px; margin-bottom: 6px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 4px; }
  .file-card img { height: 90px; }
  .msg { max-width: 80%; font-size: 11px; padding: 6px 9px; }
  .msg img.msg-img { max-width: 130px; max-height: 130px; }
  .video-circle { width: 140px; height: 140px; }
  .video-circle .play-overlay svg { width: 30px; height: 30px; }
  .msg-video-round-wrapper { width: 90px; height: 90px; }
  .msg-video-round { width: 90px; height: 90px; }
  .msg-video-play-badge { width: 24px; height: 24px; font-size: 10px; }
  .msg-audio-container { min-width: 140px; max-width: 180px; }
  .msg-audio-play { width: 26px; height: 26px; min-width: 26px; font-size: 11px; }
  .msg-audio-wave { height: 20px; gap: 1px; }
  .msg-audio-duration { font-size: 8px; min-width: 28px; }
  .chat-input-area input[type="text"] { padding: 8px 9px; font-size: 11px; }
  .chat-fullscreen { padding: 4px; }
  .reaction-picker { bottom: 100px; padding: 5px 8px; }
  .reaction-picker .emoji-btn { font-size: 20px; padding: 3px 5px; }
  .sticker-grid { grid-template-columns: repeat(3, 1fr); }
  .media-grid { grid-template-columns: repeat(2, 1fr); }
  nav span { display: none; }
  .btn { padding: 6px 9px; font-size: 10px; }
  .msg-actions-bar .btn { padding: 4px 7px; font-size: 9px; }
  .msg-actions-bar { padding: 6px 8px; gap: 4px; }
  .reply-indicator .reply-text { font-size: 10px; }
  .reply-indicator .reply-label { font-size: 9px; }
  .msg-actions .action-btn { font-size: 11px; padding: 3px 5px; min-width: 22px; height: 22px; }
  .msg-actions { top: -20px; padding: 2px 4px; }
  .icon-btn { width: 32px; height: 32px; }
  .voice-btn { width: 32px; height: 32px; }
}

.chat-icon{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:#3d8cff}
.chat-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover .chat-icon,.voice-btn:hover .chat-icon{color:#69a9ff;transform:scale(1.08)}

.chat-emoji,.reaction-picker,.reaction-badge,.photo-send-option,.recording-bar{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif}
</style>
</head>

<header>

    <nav><span id="un"></span><button onclick="openSettings()">⚙️</button><button onclick="logout()">Выйти</button></nav>
</header>

function formatLastSeen(lastSeen) {
    if (!lastSeen) return 'Неизвестно';
    var now = new Date();
    var date = new Date(lastSeen);
    var diff = Math.floor((now - date) / 1000);
    if (diff < 60) return 'только что';
    if (diff < 3600) return Math.floor(diff/60) + ' мин назад';
    if (diff < 86400) return Math.floor(diff/3600) + ' ч назад';
    if (diff < 172800) return 'вчера в ' + date.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    return Math.floor(diff/86400) + ' дн назад';
}

// ===== СМЕНА ИМЕНИ =====
function changeUsername() {
    var newName = prompt('Введите новое имя пользователя:', U.username);
    if (!newName) return;
    newName = newName.trim();
    if (newName.length < 2) {
        alert('Имя должно содержать минимум 2 символа');
        return;
    }
    
    api('/api/user/change-username', {
        method: 'POST',
        body: { username: newName }
    }).then(function(r){ return r.json() }).then(function(d){
        if (d.ok) {
            U.username = d.user.username;
            localStorage.setItem('user', JSON.stringify(U));
            document.getElementById('un').textContent = U.username;
            alert('✅ Имя изменено на: ' + d.user.username);
            var activeTab = document.querySelector('.tab.active');
            if (activeTab) {
                st(activeTab.dataset.t, activeTab);
            }
        } else if (d.error) {
            alert('❌ ' + d.error);
        }
    }).catch(function(err){
        alert('❌ Ошибка при смене имени');
    });
}

}

document.addEventListener('paste',function(e){
    var inp=document.getElementById('mi');
    if(!inp||document.activeElement!==inp)return;
    var items=e.clipboardData.items;if(!items)return;
    var has=false;
    for(var i=0;i<items.length;i++){
        var item=items[i];
        if(item.type.indexOf('image')!==-1||item.type.indexOf('video')!==-1||item.kind==='file'){
            e.preventDefault();has=true;
            var blob=item.getAsFile();
            pastedFiles.push({file:blob,name:blob.name||('paste_'+Date.now()),type:blob.type,size:blob.size,preview:blob.type.startsWith('image/')?URL.createObjectURL(blob):null});
        }
    }
    if(has)updatePastePreview();
});

function addPastedFile(file){pastedFiles.push({file:file,name:file.name||'file',type:file.type,size:file.size,preview:file.type.startsWith('image/')?URL.createObjectURL(file):null})}

function updatePastePreview(){
    var p=document.getElementById('pastePreview');if(!p)return;
    if(!pastedFiles.length){p.classList.remove('active');hidePhotoSendOptions();return}
    p.classList.add('active');
    var c='';
    pastedFiles.forEach(function(item,i){
        if(item.type.startsWith('image/'))c+='<img src="'+item.preview+'" style="max-height:120px;margin:3px">';
        else c+='<div class="paste-file-item">📄 '+item.name+' <button class="btn btn-red" onclick="removePastedFile('+i+')" style="padding:2px 6px;font-size:9px">✕</button></div>';
    });
    p.innerHTML='<div class="preview-header"><span class="preview-title">📋 '+pastedFiles.length+' файла</span><button class="preview-close" onclick="clearPastedFiles()">✕ Очистить</button></div><div class="file-list">'+c+'</div>';
    checkPhotoSendOptions();
}

function removePastedFile(i){if(pastedFiles[i]&&pastedFiles[i].preview)URL.revokeObjectURL(pastedFiles[i].preview);pastedFiles.splice(i,1);updatePastePreview()}

function clearPastedFiles(){pastedFiles.forEach(function(item){if(item.preview)URL.revokeObjectURL(item.preview)});pastedFiles=[];updatePastePreview()}

function formatSize(b){if(!b)return'0 B';var k=1024,s=['B','KB','MB','GB'],i=Math.floor(Math.log(b)/Math.log(k));return parseFloat((b/Math.pow(k,i)).toFixed(1))+' '+s[i]}

function formatDuration(sec){if(!sec||isNaN(sec))return'0:00';var m=Math.floor(sec/60);var s=Math.floor(sec%60);return m+':'+(s<10?'0':'')+s;}

function checkPhotoSendOptions(){
    var hasPhoto=false;
    for(var i=0;i<pastedFiles.length;i++){if(pastedFiles[i].type.startsWith('image/')){hasPhoto=true;break}}
    var cf=document.getElementById('cf');
    if(!hasPhoto&&cf&&cf.files){for(var i=0;i<cf.files.length;i++){if(cf.files[i].type.startsWith('image/')){hasPhoto=true;break}}}
    if(hasPhoto){showPhotoSendOptions()}else{hidePhotoSendOptions()}
}

function showPhotoSendOptions(){
    var d=document.getElementById('photoSendOptions');if(!d)return;
    d.classList.add('visible');photoSendMode=null;selfDestructMode=false;updatePhotoOptionButtons();
}

function hidePhotoSendOptions(){
    var d=document.getElementById('photoSendOptions');if(!d)return;
    d.classList.remove('visible');photoSendMode=null;selfDestructMode=false;
}

function selectPhotoMode(mode){photoSendMode=mode;selfDestructMode=(mode==='destruct');updatePhotoOptionButtons()}

function updatePhotoOptionButtons(){
    var nb=document.getElementById('photoNormalBtn'),db=document.getElementById('photoDestructBtn');
    if(nb){nb.classList.remove('selected');if(photoSendMode==='normal')nb.classList.add('selected')}
    if(db){db.classList.remove('selected');if(photoSendMode==='destruct')db.classList.add('selected')}
}

function api(url,opt){
    opt=opt||{};var h={Authorization:'Bearer '+T};
    if(opt.body&&typeof opt.body==='object'&&!(opt.body instanceof FormData)){h['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}
    return fetch(url,{method:opt.method||'GET',headers:h,body:opt.body});
}

function st(tab,el){
    if(tab==='admin'){if(!isAdmin)return;ct=null;if(ti){clearInterval(ti);ti=null}closeChatFullscreen();la();return}
    if(tab!=='chats'){ct=null;if(ti){clearInterval(ti);ti=null};closeChatFullscreen()}
    document.querySelectorAll('#tabsContainer .tab').forEach(function(x){x.classList.remove('active')});
    if(el)el.classList.add('active');
    if(tab==='files')lf();else if(tab==='users')lu();else if(tab==='friends')lfr();else if(tab==='chats')lcl();
}

function ol(url,type,msgId,isSelfDestruct){
    document.getElementById('lb').classList.add('active');document.body.style.overflow='hidden';
    if(type&&type.startsWith('image/'))document.getElementById('lbc').innerHTML='<img src="'+url+'">';
    else if(type&&type.startsWith('video/'))document.getElementById('lbc').innerHTML='<video controls autoplay playsinline style="max-width:95vw;max-height:90vh;border-radius:8px;background:#000;"><source src="'+url+'" type="'+(type||'video/mp4')+'"></video>';
    else if(type&&type.startsWith('audio/'))document.getElementById('lbc').innerHTML='<audio controls autoplay style="width:300px"><source src="'+url+'" type="'+type+'"></audio>';
    if(isSelfDestruct&&msgId&&type&&type.startsWith('image/')){currentDestructMsgId=msgId}else{currentDestructMsgId=null}
}

function cl(){
    if(currentDestructMsgId){
        var mid=currentDestructMsgId;currentDestructMsgId=null;
        api('/api/messages/'+mid+'/destruct',{method:'POST'}).then(function(){if(ct)lm(ct.id)}).catch(function(){if(ct)lm(ct.id)});
    }
    document.getElementById('lb').classList.remove('active');document.body.style.overflow='';document.getElementById('lbc').innerHTML='';
}

document.getElementById('lb').addEventListener('click',function(e){if(e.target===this)cl()});

function la(){
    api('/api/admin/stats').then(function(r){return r.json()}).then(function(stats){
        api('/api/admin/users').then(function(r){return r.json()}).then(function(d){
            var users=d.users||[],h='<div class="panel"><h2>⚙️ Админ-панель</h2>';
            
            h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px">';
            h+='<div style="background:var(--bg-input);padding:12px;border-radius:8px;text-align:center"><div style="font-size:20px;font-weight:700;color:var(--accent-light)">'+ (stats.total_users||0) +'</div><div style="font-size:10px;color:var(--text-muted)">👤 Пользователей</div></div>';
            h+='<div style="background:var(--bg-input);padding:12px;border-radius:8px;text-align:center"><div style="font-size:20px;font-weight:700;color:var(--orange)">'+ (stats.temp_users||0) +'</div><div style="font-size:10px;color:var(--text-muted)">⚡ Временных</div></div>';
            h+='<div style="background:var(--bg-input);padding:12px;border-radius:8px;text-align:center"><div style="font-size:20px;font-weight:700;color:var(--green)">'+ (stats.total_messages||0) +'</div><div style="font-size:10px;color:var(--text-muted)">💬 Сообщений</div></div>';
            h+='<div style="background:var(--bg-input);padding:12px;border-radius:8px;text-align:center"><div style="font-size:20px;font-weight:700;color:var(--red)">'+ (stats.total_files||0) +'</div><div style="font-size:10px;color:var(--text-muted)">📁 Файлов</div></div>';
            h+='</div>';
            
            h+='<p style="color:var(--text-muted);font-size:11px;margin-bottom:12px">📋 Управление пользователями</p><div class="user-list">';
            users.forEach(function(u){
                h+='<div class="user-item">';
                h+='<div class="user-info" style="flex-wrap:wrap;gap:4px">';
                h+='<span style="font-weight:600">'+u.username+'</span>';
                h+='<span style="font-size:9px;color:var(--text-muted)">'+u.email+'</span>';
                if(u.is_temp)h+='<span style="color:var(--orange);font-size:9px">⚡ Врем.</span>';
                h+=u.has_file_access?'<span style="color:var(--green);font-size:9px">📁 Доступ</span>':'<span style="color:var(--red);font-size:9px">🚫 Нет доступа</span>';
                h+='</div><div>';
                if(u.has_file_access){
                    h+='<button class="btn btn-red" onclick="event.stopPropagation();revokeFileAccess('+u.id+',\''+u.username+'\')" style="font-size:9px;padding:5px 8px">📁 Забрать</button>';
                }else{
                    h+='<button class="btn btn-green" onclick="event.stopPropagation();grantFileAccess('+u.id+',\''+u.username+'\')" style="font-size:9px;padding:5px 8px">📁 Выдать</button>';
                }
                h+='<button class="btn btn-red" onclick="event.stopPropagation();adminDeleteUser('+u.id+',\''+u.username+'\')" style="font-size:9px;padding:5px 8px">🗑️</button>';
                h+='</div></div>';
            });
            h+=(users.length?'':'<div class="empty">Нет пользователей</div>')+'</div></div>';
            document.getElementById('tc').innerHTML=h;
        });
    }).catch(function(){
        document.getElementById('tc').innerHTML='<div class="panel"><h2>⚙️ Админ-панель</h2><div class="empty">Ошибка загрузки</div></div>';
    });
}

function adminDeleteUser(userId, username) {
    if(!isAdmin) return;
    if(!confirm('🗑️ Удалить пользователя "' + username + '" и все его данные?')) return;
    api('/api/admin/user/' + userId, {method:'DELETE'}).then(function(r){
        if(r.status === 403) { alert('⛔ Недостаточно прав'); return; }
        return r.json();
    }).then(function(d){
        if(d && d.ok) {
            alert('✅ Пользователь удален');
            if(document.querySelector('.tab.active')?.dataset?.t === 'users') lu();
            else if(document.querySelector('.tab.active')?.dataset?.t === 'admin') la();
        } else if(d && d.error) {
            alert('❌ ' + d.error);
        }
    }).catch(function(err){
        alert('❌ Ошибка удаления');
    });
}

function grantFileAccess(uid,uname){
    if(!confirm('Выдать доступ к файлам пользователю '+uname+'?'))return;
    api('/api/admin/grant-file-access/'+uid,{method:'POST'}).then(function(){alert('✅ Доступ выдан!');if(document.querySelector('.tab.active')?.dataset?.t === 'admin') la();});
}

function revokeFileAccess(uid,uname){
    if(!confirm('Забрать доступ к файлам у пользователя '+uname+'?'))return;
    api('/api/admin/revoke-file-access/'+uid,{method:'POST'}).then(function(){alert('🚫 Доступ отозван!');if(document.querySelector('.tab.active')?.dataset?.t === 'admin') la();});
}

function lf(){
    api('/api/files').then(function(r){
        if(r.status===403){document.getElementById('tc').innerHTML='<div class="panel"><h2>Файлы</h2><div class="empty">⛔ Нет доступа к файлам. Обратитесь к администратору.</div></div>';return;}
        return r.json();

// ========== ПОИСК СООБЩЕНИЙ ==========
function toggleSearch(){
    var bar = document.getElementById('chatSearchBar');
    if(bar.classList.contains('active')){ closeSearch(); } else { bar.classList.add('active'); document.getElementById('searchInput').focus(); }
}

function closeSearch(){
    var bar = document.getElementById('chatSearchBar');
    bar.classList.remove('active');
    document.getElementById('searchInput').value = '';
    searchResults = [];
    searchIndex = 0;
    clearSearchHighlights();
    document.getElementById('searchCount').textContent = '';
}

function doSearch(){
    var query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    clearSearchHighlights();
    searchResults = [];
    searchIndex = 0;
    if(!query){ document.getElementById('searchCount').textContent = ''; return; }
    var messages = document.querySelectorAll('#cm .msg');
    messages.forEach(function(el){
        var text = (el.textContent || '').toLowerCase();
        if(text.indexOf(query) !== -1){
            searchResults.push(el);
            el.classList.add('search-highlight');
        }
    });
    var count = searchResults.length;
    document.getElementById('searchCount').textContent = count ? (searchIndex + 1) + '/' + count : '0/0';
    if(count > 0){ searchIndex = 0; navigateToSearchResult(); }
}

function navigateToSearchResult(){
    clearSearchCurrent();
    if(!searchResults.length) return;
    var el = searchResults[searchIndex];
    el.classList.remove('search-highlight');
    el.classList.add('search-current');
    el.scrollIntoView({behavior:'smooth',block:'center'});
    document.getElementById('searchCount').textContent = (searchIndex + 1) + '/' + searchResults.length;
}

function clearSearchHighlights(){
    document.querySelectorAll('#cm .msg.search-highlight,#cm .msg.search-current').forEach(function(e){ e.classList.remove('search-highlight','search-current'); });
}

function clearSearchCurrent(){
    document.querySelectorAll('#cm .msg.search-current').forEach(function(e){ e.classList.remove('search-current'); });
}

function prevSearch(){
    if(!searchResults.length) return;
    searchIndex = (searchIndex - 1 + searchResults.length) % searchResults.length;
    navigateToSearchResult();
}

function nextSearch(){
    if(!searchResults.length) return;
    searchIndex = (searchIndex + 1) % searchResults.length;
    navigateToSearchResult();
}

function openMediaModal(chatId){
    document.getElementById('mediaModal').classList.add('active');
    document.body.style.overflow = 'hidden';
    document.getElementById('mediaModalTitle').textContent = '📸 Медиа';
    currentMediaTab = 'all';
    document.querySelectorAll('.media-tab').forEach(function(t,i){ t.classList.toggle('active', i === 0); });
    loadChatMedia(chatId);
}

function closeMediaModal(){
    document.getElementById('mediaModal').classList.remove('active');
    document.body.style.overflow = '';
}

document.getElementById('mediaModal').addEventListener('click',function(e){if(e.target===this)closeMediaModal()});

function switchMediaTab(tab){
    currentMediaTab = tab;
    document.querySelectorAll('.media-tab').forEach(function(t){
        var isActive = false;
        if(tab === 'all' && t.textContent === 'Все') isActive = true;
        if(tab === 'photo' && t.textContent.indexOf('Фото') !== -1) isActive = true;
        if(tab === 'video' && t.textContent.indexOf('Видео') !== -1) isActive = true;
        if(tab === 'file' && t.textContent.indexOf('Файлы') !== -1) isActive = true;
        t.classList.toggle('active', isActive);
    });
    renderMediaGrid();
}

function loadChatMedia(chatId){
    api('/api/messages/' + chatId).then(function(r){return r.json()}).then(function(d){
        var messages = d.messages || [];
        cachedMedia = [];
        messages.forEach(function(m){ if(m.file_path) cachedMedia.push(m); });
        renderMediaGrid();
    });
}

function renderMediaGrid(){
    var grid = document.getElementById('mediaGrid');
    var items = cachedMedia;
    if(currentMediaTab === 'photo'){ items = items.filter(function(m){return m.file_type && m.file_type.startsWith('image/');}); }
    else if(currentMediaTab === 'video'){ items = items.filter(function(m){return m.file_type && m.file_type.startsWith('video/');}); }
    else if(currentMediaTab === 'file'){ items = items.filter(function(m){ return !m.file_type || (!m.file_type.startsWith('image/') && !m.file_type.startsWith('video/') && !m.file_type.startsWith('audio/')); }); }
    if(!items.length){ grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Нет медиа</div>'; return; }
    var html = '';
    items.forEach(function(m){
        if(m.file_type && m.file_type.startsWith('image/')){ html += '<div class="media-item" onclick="closeMediaModal();ol(\'' + m.file_path + '\',\'' + m.file_type + '\')"><img src="' + m.file_path + '" loading="lazy"></div>'; }
        else if(m.file_type && m.file_type.startsWith('video/')){ html += '<div class="media-item" onclick="closeMediaModal();ol(\'' + m.file_path + '\',\'' + m.file_type + '\')"><video src="' + m.file_path + '" muted></video><div class="play-icon">▶</div></div>'; }
        else { html += '<div class="media-item" onclick="window.open(\'' + m.file_path + '\')"><div class="file-icon">' + fiIcon(m.file_name || '') + '</div></div>'; }
    });
    grid.innerHTML = html;
}

// ========== УДАЛЕНИЕ СООБЩЕНИЙ ==========
function deleteSelected(deleteFor){
    var ids=Object.keys(selectedMessages);
    if(!ids.length)return;
    if(deleteFor==='all'){
        var hasForeign=false;
        for(var j=0;j<ids.length;j++){ if(!selectedMessages[ids[j]].isSent){ hasForeign=true; break; } }
        if(hasForeign){
            if(!confirm('Чужие сообщения нельзя удалить у всех. Они будут удалены только у вас. Продолжить?'))return;
            var k=0;
            function processMixed(){
                if(k>=ids.length){clearSelection();lm(ct.id);return}
                var msgId=ids[k];
                var isSent=selectedMessages[msgId].isSent;
                var deleteForThis=isSent?'all':'me';
                api('/api/messages/'+msgId+'/delete',{ method:'POST', body:{delete_for:deleteForThis} }).then(function(){k++;processMixed()}).catch(function(){k++;processMixed()})
            }
            processMixed();
            return;
        }
    }
    var confirmText=deleteFor==='all'?'удалить у всех':'удалить у себя';
    if(!confirm('Вы уверены что хотите '+confirmText+' '+ids.length+' сообщений?'))return;
    var i=0;
    function nx(){
        if(i>=ids.length){clearSelection();lm(ct.id);return}
        api('/api/messages/'+ids[i]+'/delete',{ method:'POST', body:{delete_for:deleteFor} }).then(function(){i++;nx()}).catch(function(){i++;nx()})
    }
    nx();
}

        api('/api/messages/'+fid,{ method:'POST', body:body }).then(function(){i++;nx()}).catch(function(){i++;nx()})
    }
    nx();
}

// ===== КЛИК В ЧАТЕ (НЕ НА СООБЩЕНИИ) - ПОКАЗЫВАЕМ МЕНЮ ДЛЯ СООБЩЕНИЯ НА ЭТОМ УРОВНЕ =====
document.addEventListener('click', function(e) {
    var cm = document.getElementById('cm');
    if (cm && cm.contains(e.target) && !e.target.closest('.msg')) {
        // Находим сообщение, которое находится на уровне клика
        var clickY = e.clientY;
        var messages = cm.querySelectorAll('.msg');
        var targetMsg = null;
        var minDist = Infinity;
        
        messages.forEach(function(msg) {
            var rect = msg.getBoundingClientRect();
            var centerY = rect.top + rect.height / 2;
            var dist = Math.abs(clickY - centerY);
            if (dist < minDist) {
                minDist = dist;
                targetMsg = msg;
            }
        });
        
        if (targetMsg) {
            var msgId = targetMsg.getAttribute('data-msg-id');
            if (msgId) {
                showMsgActions(targetMsg, msgId);
                return;
            }
        }
        closeAllMsgActions();
    }
});

function toggleReactionPicker(msgEl, msgId) {
    var oldPicker = document.getElementById('reactionPicker');
    if (oldPicker) oldPicker.remove();
    
    if (activeReactionMsg === msgId) {

    }
    
    activeReactionMsg = msgId;

    }, 5000);

function startReplyToMessage(msgId, messageText, filePath, fileName) {
    var msgData = cachedMessages[ct.id] || [];

    for (var i = 0; i < msgData.length; i++) {
        if (msgData[i].id == msgId) {
            originalMsg = msgData[i];
            break;

    }
    
    replyToMsg = {

        text: messageText || (fileName || 'Файл'),

    };

        if (replyText.length > 50) replyText = replyText.substring(0, 50) + '...';
        
        var senderName = replyToMsg.sender || 'Пользователь';
        
        replyIndicator.querySelector('.reply-username').textContent = senderName;

function editMessage(msgId) {
    var msgData = cachedMessages[ct.id] || [];

    for (var i = 0; i < msgData.length; i++) {
        if (msgData[i].id == msgId) {

            break;

    }
    if (!msg) return;

    var modal = document.createElement('div');

            <h3 style="margin-bottom:10px;font-size:13px;">✏️ Редактировать сообщение</h3>

        var newText = textarea.value.trim();

        api('/api/messages/' + msgId, {
            method: 'PUT',

// ===== ЗАПИСЬ ГОЛОСОВОГО СООБЩЕНИЯ (ОДНА КНОПКА) =====
async function toggleVoiceRecording() {
    var voiceBtn = document.getElementById('voiceBtn');
    
    if (isRecording) {
        if (voiceRecorder && voiceRecorder.state === 'recording') {
            voiceRecorder.stop();
            if (voiceRecorder._timer) {
                clearInterval(voiceRecorder._timer);
                voiceRecorder._timer = null;
            }
        }
        voiceBtn.classList.remove('recording');
        voiceBtn.innerHTML = '<span class="chat-icon">'+uiIcon('mic')+'</span>';
        voiceBtn.title = 'Голосовое сообщение';
        isRecording = false;
        document.getElementById('recBar').style.display = 'none';
        return;
    }
    
    try {
        var stream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
                sampleRate: 48000,
                channelCount: 1
            }
        });
        
        var mimeType = 'audio/webm;codecs=opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = 'audio/webm';
        }
        if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = 'audio/ogg;codecs=opus';
        }
        
        voiceRecorder = new MediaRecorder(stream, {
            mimeType: mimeType,
            audioBitsPerSecond: 128000
        });
        
        voiceChunks = [];
        var startTime = Date.now();
        
        voiceRecorder.ondataavailable = function(e) {
            if (e.data.size > 0) voiceChunks.push(e.data);
        };
        
        voiceRecorder.onstop = function() {
            stream.getTracks().forEach(function(t) { t.stop(); });
            
            var blob = new Blob(voiceChunks, { type: mimeType });
            
            if (blob.size < 1000) {
                alert('Запись слишком короткая');
                return;
            }
            
            var fileName = 'voice_' + Date.now() + '.webm';
            var file = new File([blob], fileName, { type: mimeType });
            
            sendFile(ct.id, file);
            document.getElementById('recBar').style.display = 'none';
        };
        
        voiceRecorder.start(100);
        isRecording = true;
        
        voiceBtn.classList.add('recording');
        voiceBtn.innerHTML = '<span class="chat-icon">'+uiIcon('mic')+'</span>';
        voiceBtn.title = 'Остановить запись';
        
        document.getElementById('recBar').style.display = 'block';
        document.getElementById('recBar').innerHTML = '⏺️ Запись... <span id="recTime">0:00</span>';
        
        voiceRecorder._timer = setInterval(function() {
            var elapsed = Math.floor((Date.now() - startTime) / 1000);
            var minutes = Math.floor(elapsed / 60);
            var seconds = elapsed % 60;
            var timeEl = document.getElementById('recTime');
            if (timeEl) {
                timeEl.textContent = minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
            }
        }, 1000);
        
    } catch(e) {
        console.error('Ошибка доступа к микрофону:', e);
        alert('Нет доступа к микрофону. Разрешите доступ в настройках браузера.');
    }
}

function attachMsgEvents(el, msg) {
    var msgId = msg.id;

    });
    
    el.addEventListener('dblclick', function(e) {
        e.stopPropagation();
        toggleMessage(el, msgId, isSent);
    });
    
    var longPressTimer = null;
    el.addEventListener('touchstart', function(e) {
        longPressTimer = setTimeout(function() {
            if (navigator.vibrate) navigator.vibrate(20);
            showMsgActions(el, msgId);
        }, 400);
    });
    el.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
    el.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });
    
    el.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        startReplyToMessage(msgId, msg.message_text, msg.file_path, msg.file_name);
    });
}

function createVideoElement(videoData) {
    var wrapper = document.createElement('div');
    wrapper.className = 'video-wrapper';
    
    var circle = document.createElement('div');
    circle.className = 'video-circle';
    
    var video = document.createElement('video');
    
    var videoUrl = videoData.url || videoData.file_path || videoData;
    if (videoUrl && !videoUrl.startsWith('http') && !videoUrl.startsWith('/')) {
        videoUrl = '/' + videoUrl;
    }
    video.src = videoUrl;
    video.muted = true;
    video.loop = false;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.preload = 'metadata';
    
    video.style.width = '100%';
    video.style.height = '100%';
    video.style.objectFit = 'cover';
    video.style.borderRadius = '50%';
    
    circle.addEventListener('mouseenter', function() {
        video.play().catch(function() {});
    });
    
    circle.addEventListener('mouseleave', function() {
        video.pause();
    });
    
    circle.addEventListener('click', function(e) {
        e.stopPropagation();
        if (video.paused) {
            video.play().catch(function() {});
        } else {
            video.pause();
        }
    });
    
    circle.addEventListener('dblclick', function(e) {
        e.stopPropagation();
        openVideoFullscreen(videoUrl, videoData.file_type || 'video/mp4');
    });
    
    if (videoData.duration && Number(videoData.duration) > 0) {
        var knownDuration = document.createElement('div');
        knownDuration.className = 'duration';
        knownDuration.textContent = formatDuration(videoData.duration);
        circle.appendChild(knownDuration);
    }
    
    var overlay = document.createElement('div');
    overlay.className = 'play-overlay';
    overlay.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>';
    
    circle.appendChild(overlay);
    circle.appendChild(video);
    wrapper.appendChild(circle);
    
    return wrapper;
}

function playAudio(btn, url) {
    if (currentAudio && currentAudio.src.includes(url) && !currentAudio.paused) {
        currentAudio.pause();
        if (currentAudioBtn) {
            currentAudioBtn.textContent = '▶';
            currentAudioBtn.classList.remove('playing');
        }
        return;
    }
    
    if (currentAudio) {
        currentAudio.pause();
        if (currentAudioBtn) {
            currentAudioBtn.textContent = '▶';
            currentAudioBtn.classList.remove('playing');
        }
    }
    
    var audio = new Audio(url);
    var durationEl = btn.parentElement.querySelector('.msg-audio-duration');
    var waveBars = btn.parentElement.querySelectorAll('.bar');
    
    audio.preload = 'metadata';
    
    audio.onloadedmetadata = function() {
        if (durationEl) {
            var duration = audio.duration;
            if (!isNaN(duration) && isFinite(duration) && duration > 0) {
                durationEl.textContent = formatDuration(duration);
            } else {
                setTimeout(function() {
                    if (durationEl && !isNaN(audio.duration) && isFinite(audio.duration) && audio.duration > 0) {
                        durationEl.textContent = formatDuration(audio.duration);
                    }
                }, 300);
            }
        }
    };
    
    if (audio.readyState >= 1) {
        if (durationEl) {
            var duration = audio.duration;
            if (!isNaN(duration) && isFinite(duration) && duration > 0) {
                durationEl.textContent = formatDuration(duration);
            }
        }
    }
    
    audio.ontimeupdate = function() {
        if (durationEl) {
            var current = audio.currentTime;
            if (!isNaN(current) && isFinite(current)) {
                var remaining = audio.duration - current;
                if (!isNaN(remaining) && isFinite(remaining) && remaining > 0) {
                    durationEl.textContent = formatDuration(remaining);
                }
            }
        }
        
        if (waveBars && waveBars.length > 0) {
            var progress = audio.currentTime / audio.duration;
            if (!isNaN(progress) && isFinite(progress)) {
                var index = Math.floor(progress * waveBars.length);
                waveBars.forEach(function(bar, i) {
                    var height = 20 + Math.random() * 80;
                    if (i > index) {
                        height = 10 + Math.random() * 20;
                    }
                    bar.style.height = height + '%';
                });
            }
        }
    };
    
    audio.onplay = function() {
        btn.textContent = '⏸';
        btn.classList.add('playing');
        
        if (waveBars) {
            var interval = setInterval(function() {
                if (audio.paused) {
                    clearInterval(interval);
                    return;
                }
                waveBars.forEach(function(bar) {
                    var height = 15 + Math.random() * 85;
                    bar.style.height = height + '%';
                });
            }, 200);
            audio._waveInterval = interval;
        }
    };
    
    audio.onpause = function() {
        btn.textContent = '▶';
        btn.classList.remove('playing');
        if (audio._waveInterval) {
            clearInterval(audio._waveInterval);
            audio._waveInterval = null;
        }
    };
    
    audio.onended = function() {
        btn.textContent = '▶';
        btn.classList.remove('playing');
        if (durationEl) {
            var duration = audio.duration;
            if (!isNaN(duration) && isFinite(duration) && duration > 0) {
                durationEl.textContent = formatDuration(duration);
            }
        }
        if (audio._waveInterval) {
            clearInterval(audio._waveInterval);
            audio._waveInterval = null;
        }
        var heights = [30, 60, 45, 90, 70, 35, 100, 55, 80, 40, 65, 50, 85, 30, 75];
        waveBars.forEach(function(bar, i) {
            bar.style.height = heights[i % heights.length] + '%';
        });
    };
    
    audio.onerror = function(e) {
        console.error('Ошибка аудио:', e);
        btn.textContent = '▶';
        btn.classList.remove('playing');
        if (durationEl) {
            durationEl.textContent = '0:00';
        }
        if (audio._waveInterval) {
            clearInterval(audio._waveInterval);
            audio._waveInterval = null;
        }
    };
    
    audio.play().catch(function(err) {
        console.error('Ошибка воспроизведения:', err);
        btn.textContent = '▶';
        btn.classList.remove('playing');
        if (durationEl) {
            durationEl.textContent = '0:00';
        }
    });
    
    currentAudio = audio;
    currentAudioBtn = btn;
}

// ===== ЗАПИСЬ ВИДЕО =====
async function startRec(type) {
    try {
        var constraints = {
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
                sampleRate: 48000,
                channelCount: 1
            }
        };
        
        if (type === 'video') {
            constraints.video = {
                facingMode: 'user',
                width: { ideal: 640 },
                height: { ideal: 480 }
            };
        }
        
        var stream = await navigator.mediaDevices.getUserMedia(constraints);
        
        var mimeType = 'audio/webm;codecs=opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) { mimeType = 'audio/webm'; }
        if (!MediaRecorder.isTypeSupported(mimeType)) { mimeType = 'audio/ogg;codecs=opus'; }
        
        if (type === 'video') {
            var videoMime = 'video/webm;codecs=vp8,opus';
            if (!MediaRecorder.isTypeSupported(videoMime)) {
                videoMime = 'video/webm';
            }
            if (MediaRecorder.isTypeSupported(videoMime)) {
                mimeType = videoMime;
            }
        }
        
        mediaRecorder = new MediaRecorder(stream, { 
            mimeType: mimeType,
            audioBitsPerSecond: 128000,
            videoBitsPerSecond: 2500000
        });
        
        var chunks = [];
        var startTime = Date.now();
        
        mediaRecorder.ondataavailable = function(e) {
            if (e.data.size > 0) chunks.push(e.data);
        };
        
        mediaRecorder.onstop = function() {
            stream.getTracks().forEach(function(t) { t.stop(); });
            
            var blob = new Blob(chunks, { type: mimeType });
            
            if (blob.size < 1000) {
                alert('Запись слишком короткая или пустая.');
                document.getElementById('recBar').style.display = 'none';
                document.getElementById('vidBtn').classList.remove('btn-rec');
                return;
            }
            
            var ext = (type === 'video' && mimeType.includes('video')) ? 'webm' : 'webm';
            var fileName = (type === 'audio' ? 'voice_' : 'video_') + Date.now() + '.' + ext;
            var file = new File([blob], fileName, { type: mimeType });
            
            sendFile(ct.id, file);
            document.getElementById('recBar').style.display = 'none';
            document.getElementById('vidBtn').classList.remove('btn-rec');
        };
        
        mediaRecorder.start(100);
        document.getElementById('recBar').style.display = 'block';
        document.getElementById('recBar').innerHTML = '⏺️ Запись... <span id="recTime">0:00</span> <button class="btn" onclick="stopRecording()" style="background:#fff;color:var(--red);margin-left:6px;padding:4px 10px;font-size:10px">Стоп</button>';
        
        var recTimer = setInterval(function() {
            var elapsed = Math.floor((Date.now() - startTime) / 1000);
            var minutes = Math.floor(elapsed / 60);
            var seconds = elapsed % 60;
            var timeEl = document.getElementById('recTime');
            if (timeEl) {
                timeEl.textContent = minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
            }
        }, 1000);
        
        mediaRecorder._timer = recTimer;
        document.getElementById('vidBtn').classList.add('btn-rec');
        
    } catch(e) {
        console.error('Ошибка доступа к микрофону/камере:', e);
        if (type === 'video') {
            alert('Нет доступа к камере и микрофону. Разрешите доступ в настройках браузера.');
        }
    }
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        if (mediaRecorder._timer) { clearInterval(mediaRecorder._timer); mediaRecorder._timer = null; }
    }
}

function getMediaDuration(file) {
    return new Promise(function(resolve) {
        if (!file || !(file.type || '').match(/^(audio|video)\//)) return resolve(null);
        var url = URL.createObjectURL(file);
        var media = document.createElement(file.type.startsWith('video/') ? 'video' : 'audio');
        media.preload = 'metadata';
        media.onloadedmetadata = function(){
            var d = Number(media.duration);
            URL.revokeObjectURL(url);
            resolve(Number.isFinite(d) && d > 0 ? d : null);
        };
        media.onerror = function(){ URL.revokeObjectURL(url); resolve(null); };
        media.src = url;
    });
}
